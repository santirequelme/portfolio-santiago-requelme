<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Aura Design System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Brand -->
  <rect x="80" y="72" width="56" height="56" rx="14" fill="url(#mark)"/>
  <path d="M108 88 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" fill="#fff" transform="translate(-4,-4) scale(0.9)" transform-origin="108 116"/>
  <text x="152" y="100" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#18181b">Aura</text>
  <text x="152" y="126" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#71717a">Design System</text>

  <!-- Accent ramp card -->
  <g filter="url(#card)">
    <rect x="80" y="180" width="1040" height="96" rx="14" fill="#ffffff"/>
  </g>
  <g>
    <rect x="104" y="204" width="150" height="48" rx="8" fill="#e0e7ff"/>
    <rect x="266" y="204" width="150" height="48" rx="8" fill="#a5b4fc"/>
    <rect x="428" y="204" width="150" height="48" rx="8" fill="#818cf8"/>
    <rect x="590" y="204" width="150" height="48" rx="8" fill="#6366f1"/>
    <rect x="752" y="204" width="150" height="48" rx="8" fill="#4f46e5"/>
    <rect x="914" y="204" width="182" height="48" rx="8" fill="#4338ca"/>
  </g>

  <!-- Buttons -->
  <rect x="80" y="326" width="180" height="58" rx="12" fill="#4f46e5"/>
  <text x="170" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#ffffff">Primary</text>
  <rect x="278" y="326" width="180" height="58" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="368" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#18181b">Secondary</text>
  <rect x="476" y="326" width="180" height="58" rx="29" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="566" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#4f46e5">Outline</text>

  <!-- Badges -->
  <g font-family="system-ui, sans-serif" font-size="17" font-weight="600">
    <rect x="690" y="333" width="112" height="44" rx="22" fill="#dcfce7"/>
    <circle cx="712" cy="355" r="4" fill="#16a34a"/><text x="726" y="361" fill="#16a34a">Active</text>
    <rect x="814" y="333" width="120" height="44" rx="22" fill="#fef3c7"/>
    <circle cx="836" cy="355" r="4" fill="#d97706"/><text x="850" y="361" fill="#d97706">Pending</text>
    <rect x="946" y="333" width="112" height="44" rx="22" fill="#e0e7ff"/>
    <text x="1002" y="361" text-anchor="middle" fill="#4f46e5">Accent</text>
  </g>

  <!-- Switch + toggle track -->
  <rect x="80" y="430" width="64" height="36" rx="18" fill="#4f46e5"/>
  <circle cx="126" cy="448" r="14" fill="#ffffff"/>
  <rect x="160" y="430" width="64" height="36" rx="18" fill="#d4d4d8"/>
  <circle cx="178" cy="448" r="14" fill="#ffffff"/>

  <!-- Footnote -->
  <text x="80" y="556" font-family="system-ui, sans-serif" font-size="20" fill="#52525b">Tokens · Typography · Spacing · Elevation · Motion · Components</text>
  <rect x="80" y="588" width="1040" height="4" rx="2" fill="url(#accent)" opacity="0.4"/>
</svg>
