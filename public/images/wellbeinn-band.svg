<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Wellbeinn Band product landing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1d24"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26323f"/>
      <stop offset="1" stop-color="#151c26"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1418"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="90" y="70" width="1020" height="560" rx="22" fill="#0f171f" stroke="#22323d"/>
  </g>
  <circle cx="122" cy="102" r="6" fill="#2a3a46"/>
  <circle cx="142" cy="102" r="6" fill="#2a3a46"/>
  <circle cx="162" cy="102" r="6" fill="#2a3a46"/>
  <rect x="420" y="92" width="360" height="20" rx="10" fill="#18242e"/>
  <line x1="90" y1="128" x2="1110" y2="128" stroke="#22323d"/>

  <!-- Nav -->
  <rect x="130" y="156" width="110" height="16" rx="8" fill="url(#accent)"/>
  <rect x="700" y="158" width="60" height="12" rx="6" fill="#2a3a46"/>
  <rect x="780" y="158" width="60" height="12" rx="6" fill="#2a3a46"/>
  <rect x="860" y="158" width="60" height="12" rx="6" fill="#2a3a46"/>
  <rect x="960" y="150" width="110" height="28" rx="14" fill="#1b2a33" stroke="#2dd4bf" stroke-opacity="0.5"/>

  <!-- Hero copy -->
  <rect x="130" y="250" width="120" height="14" rx="7" fill="#2dd4bf" opacity="0.7"/>
  <rect x="130" y="286" width="380" height="34" rx="10" fill="#e6f4f1"/>
  <rect x="130" y="332" width="300" height="34" rx="10" fill="#e6f4f1"/>
  <rect x="130" y="392" width="360" height="12" rx="6" fill="#3a4a56"/>
  <rect x="130" y="414" width="320" height="12" rx="6" fill="#3a4a56"/>
  <rect x="130" y="436" width="260" height="12" rx="6" fill="#3a4a56"/>
  <rect x="130" y="482" width="150" height="44" rx="22" fill="url(#accent)"/>
  <rect x="296" y="482" width="130" height="44" rx="22" fill="none" stroke="#3a4a56" stroke-width="2"/>

  <!-- Feature chips -->
  <g opacity="0.9">
    <rect x="130" y="560" width="96" height="30" rx="15" fill="#15232b" stroke="#22323d"/>
    <rect x="236" y="560" width="96" height="30" rx="15" fill="#15232b" stroke="#22323d"/>
    <rect x="342" y="560" width="96" height="30" rx="15" fill="#15232b" stroke="#22323d"/>
    <circle cx="150" cy="575" r="5" fill="#5eead4"/>
    <circle cx="256" cy="575" r="5" fill="#818cf8"/>
    <circle cx="362" cy="575" r="5" fill="#f472b6"/>
  </g>

  <!-- Band -->
  <g transform="translate(820 380)">
    <ellipse cx="0" cy="190" rx="200" ry="22" fill="#000" opacity="0.35"/>
    <!-- back strap -->
    <path d="M -150 -40 C -170 -190, 170 -190, 150 -40" fill="none" stroke="#1a232e" stroke-width="64" stroke-linecap="round"/>
    <!-- front strap -->
    <path d="M -150 -40 C -170 110, 170 110, 150 -40" fill="none" stroke="url(#strap)" stroke-width="70" stroke-linecap="round"/>
    <path d="M -150 -40 C -170 110, 170 110, 150 -40" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2"/>
    <!-- module -->
    <g transform="rotate(-6)">
      <rect x="-82" y="-8" width="164" height="96" rx="34" fill="#202a35" stroke="#33424f" stroke-width="2"/>
      <rect x="-68" y="4" width="136" height="72" rx="24" fill="url(#screen)"/>
      <polyline points="-54,44 -30,44 -20,24 -8,62 4,30 14,44 54,44" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="20" r="5" fill="#818cf8"/>
    </g>
    <!-- pulse rings -->
    <circle cx="0" cy="30" r="150" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="0" cy="30" r="200" fill="none" stroke="#2dd4bf" stroke-opacity="0.06" stroke-width="2"/>
  </g>
</svg>
